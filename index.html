<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lancer 简易车卡器</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/faq.css">
<link rel="stylesheet" href="assets/css/ux-upgrades.css">
<link rel="stylesheet" href="assets/css/lore-codex.css">
</head>
<body>
<a class="skip-link" href="#app">跳到编辑区域</a>
<header class="top">
	<div class="brand">LANCER<span>简易车卡器</span></div>
	<div class="top-ctl">
		<div class="top-group top-pilot">
			<select id="charSelect" title="切换角色" aria-label="切换角色" hidden></select>
			<details class="top-dropdown pilot-switcher" id="pilotSwitcher">
				<summary aria-label="切换或搜索角色"><span class="ps-summary-main"><strong id="psCurName">新驾驶员</strong><small id="psCurMeta">LL0</small></span></summary>
				<div class="top-dropdown-panel pilot-switcher-panel">
					<div class="ps-head">
						<input type="search" id="pilotSearchInput" placeholder="搜索呼号、姓名、骨架或等级…" aria-label="搜索角色">
						<select id="pilotSortSelect" aria-label="角色排序">
							<option value="order">默认顺序</option>
							<option value="ll">按等级</option>
							<option value="name">按名称</option>
						</select>
					</div>
					<div id="pilotSwitcherList" class="ps-list" role="listbox" aria-label="角色列表"></div>
					<div class="ps-foot"><button type="button" data-act="newChar" class="primary">＋ 新建角色</button><button type="button" data-act="dupChar">复制当前</button></div>
				</div>
			</details>
			<button data-act="newChar">新建</button>
			<button data-act="toWizard" title="用引导式流程检查/修改当前角色">引导车卡</button>
			<details class="character-menu" id="characterMenu"><summary>角色管理</summary><div class="character-menu-panel">
				<button data-act="importJson">导入角色 JSON</button>
				<button data-act="exportAll">备份全部角色</button>
				<button data-act="dupChar">复制当前角色</button>
				<label class="chk"><input type="checkbox" id="ignoreLimits"> 无视牌照限制（GM）</label>
				<button data-act="delChar" class="danger">删除当前角色</button>
			</div></details>
		</div>
		<div class="top-group top-ref">
			<button type="button" data-ui="openQuickLookup" class="quick-lookup-btn" title="全局检索术语、武器、系统、骨架、天赋与 FAQ（Ctrl+K）"><span>速查</span><kbd>Ctrl+K</kbd></button>
			<details class="top-dropdown" id="refMenu"><summary>规则与图鉴</summary><div class="top-dropdown-panel ref-menu-panel">
				<button data-ui="openLoreCodex" title="统一浏览骨架、牌照合集、装备、天赋与背景的世界观风味文本"><span>风味典藏</span><small>世界观与设定档案集</small></button>
				<button data-ui="openGlossary" title="查询规则术语"><span>术语库</span><small>状态、标签与动作</small></button>
				<button data-ui="openWeaponTable" title="查看全部机甲武器"><span>武器表</span><small>全部机甲武器图鉴</small></button>
				<button data-ui="openSystemLibrary" title="查找全部机甲系统与武器改装"><span>系统库</span><small>系统与改装图鉴</small></button>
				<button id="openDamageReference" aria-haspopup="dialog" title="结构伤害与过热（压力）判定表"><span>判定速查</span><small>结构伤害与过热表</small></button>
				<button data-ui="openFAQ" title="查阅中文规则问答与勘误" aria-haspopup="dialog"><span>规则 FAQ</span><small>社区问答与官方勘误</small></button>
			</div></details>
			<details class="top-dropdown" id="gmMenu"><summary>GM 工具</summary><div class="top-dropdown-panel gm-menu-panel" id="gmMenuPanel">
				<button type="button" data-tab="battle" title="打开本地六边形战斗地图"><span>战斗地图</span><small>六边形战棋工具</small></button>
			</div></details>
		</div>
		<div class="top-group top-status">
			<button id="openAnnouncements" class="ann-trigger" aria-haspopup="dialog" title="查看车卡器版本更新与规则修订公告">公告<span class="ann-dot" hidden aria-hidden="true"></span></button>
			<span id="saveStatus" class="save-status" role="status" aria-live="polite">保存在此浏览器</span>
		</div>
	</div>
</header>
<nav class="tabs" aria-label="角色编辑页面">
	<button data-tab="pilot" class="on">① 驾驶员</button>
	<button data-tab="progress">② 等级成长</button>
	<button data-tab="mech">③ 机甲</button>
	<button data-tab="sheet" aria-label="④ 角色卡 / 导出">④ <span class="tab-full">角色卡 / 实战</span><span class="tab-short">卡/实战</span></button>
	<button data-tab="battle">⑤ 战斗地图</button>
	<div class="badge-wrap"><button id="checkBadge" class="badge" aria-haspopup="true" aria-expanded="false" title="点击查看并定位规则检查项"></button><div id="checkPopover" class="check-popover" hidden role="region" aria-label="规则检查定位清单"></div></div>
</nav>
<div id="notice"></div>
<main id="app" tabindex="-1"></main>
<div id="modal"></div>
<aside id="glossary" class="glossary" hidden aria-label="术语库">
	<div class="glossary-top"><h2>术语库</h2><button data-ui="closeGlossary" aria-label="关闭术语库">✕</button></div>
	<label class="search-field"><span>查找术语</span><input type="search" data-ui="glossarySearch" placeholder="术语名称或说明中的关键词"></label>
	<div class="glossary-cats"></div><p class="muted glossary-count" role="status"></p>
	<div class="glossary-list"></div>
</aside>
<aside id="weaponTable" class="weapon-table" hidden aria-label="武器表">
	<div class="glossary-top"><h2>武器表</h2><div class="row" style="margin:0"><button type="button" data-ui="openLoreCodex" data-lore-cat="weapon">风味典藏（已去重 GMS 系列）</button><button data-ui="closeWeaponTable" aria-label="关闭武器表">✕</button></div></div>
	<div class="catalog-toolbar wt-toolbar"><label class="search-field"><span>查找武器</span><input type="search" data-wt="q" placeholder="名称、效果、标签或牌照"></label><div class="wt-filters"></div><button data-ui="resetWeaponTable">重置</button><span class="muted wt-count" role="status"></span></div>
	<div class="wt-scroll"><table class="wt-table"><thead><tr><th>武器</th><th>来源</th><th>尺寸</th><th>类型</th><th>射程</th><th>伤害</th><th>标签</th><th>SP</th><th>效果</th></tr></thead><tbody class="wt-body"></tbody></table></div>
</aside>
<aside id="systemLibrary" class="weapon-table system-library" hidden aria-label="系统库">
	<div class="glossary-top"><h2>系统库</h2><div class="row" style="margin:0"><button type="button" data-ui="openLoreCodex" data-lore-cat="system">风味典藏（沉浸阅读）</button><button data-ui="closeSystemLibrary" aria-label="关闭系统库">✕</button></div></div>
	<div class="catalog-toolbar wt-toolbar"><label class="search-field"><span>查找系统</span><input type="search" data-sl="q" placeholder="名称、效果、标签、牌照或风味文本"></label><div class="sl-filters"></div><button data-ui="resetSystemLibrary">重置</button><span class="muted sl-count" role="status"></span></div>
	<p class="muted">显示基础数据；工程、核心奖励等加成后的数值请查看机甲配装。</p>
	<div class="wt-scroll"><table class="wt-table"><thead><tr><th>系统／改装</th><th>来源</th><th>类型</th><th>基础 SP</th><th>基础标签</th><th>效果与风味文本</th></tr></thead><tbody class="sl-body"></tbody></table></div>
</aside>
<footer class="foot">
	中文译名修订依据：用户提供的《枪骑兵》核心规则书 v3.5（<a href="docs/TRANSLATION-V35.md" target="_blank">修订对照表</a>）。
	规则文本：<a href="https://reno-lam.github.io/Lancer-Free-Version/" target="_blank">Lancer 免费版繁中规则站</a>；数值数据：<a href="https://github.com/massif-press/lancer-data" target="_blank">massif-press/lancer-data</a>（COMP/CON 开源数据）。<a href="docs/EQUIPMENT-LORE-AUDIT.md" target="_blank">风味文本缺项清单</a>。角色存在浏览器本地（localStorage），换电脑请用导出 JSON。
</footer>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="assets/js/data.js"></script>
<script src="assets/js/equipment-lore.js"></script>
<script src="assets/js/wizard.js"></script>
<script src="assets/js/cardexport.js"></script>
<script src="assets/js/rules.js"></script>
<script src="assets/js/glossary.js"></script>
<script src="assets/js/ui.js"></script>
<link rel="stylesheet" href="assets/css/system-library.css"><script src="assets/js/system-library.js"></script>
<script src="assets/js/faq-data.js"></script>
<script src="assets/js/faq.js"></script>
<script src="assets/js/frame-catalog.js"></script><link rel="stylesheet" href="assets/css/frame-catalog.css">
<script src="assets/js/battlemap.js"></script><script src="assets/js/lore-codex.js"></script><script src="assets/js/ux-upgrades.js"></script><script src="assets/js/app.js"></script><script src="assets/js/foundry-export.js"></script><link rel="stylesheet" href="assets/css/battlemap.css">
<link rel="stylesheet" href="assets/css/damage-reference.css">
<script src="assets/js/damage-reference.js"></script>
<link rel="stylesheet" href="assets/css/announcements.css">
<script src="assets/js/announcements.js"></script>
<link rel="stylesheet" href="assets/css/npc-library.css">
<script src="assets/js/npc-data.js"></script>
<script src="assets/js/npc-library.js"></script>
<link rel="stylesheet" href="assets/css/npc-builder.css">
<script src="assets/js/npc-classes.js"></script>
<script src="assets/js/npc-builder.js"></script>
</body>
</html>
