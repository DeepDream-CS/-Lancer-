<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lancer 简易车卡器</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="faq.css">
</head>
<body>
<a class="skip-link" href="#app">跳到编辑区域</a>
<header class="top">
	<div class="brand">LANCER<span>简易车卡器</span></div>
	<div class="top-ctl">
		<select id="charSelect" title="切换角色" aria-label="切换角色"></select>
		<button data-act="newChar">新建</button>
		<button data-act="toWizard" title="用引导式流程检查/修改当前角色">引导车卡</button>
		<button data-ui="openGlossary" title="查询规则术语">术语库</button>
		<button data-ui="openWeaponTable" title="查看全部机甲武器">武器表</button>
		<button data-ui="openFAQ" title="查阅中文规则问答与勘误" aria-haspopup="dialog">规则 FAQ</button>
		<details class="character-menu" id="characterMenu"><summary>角色管理</summary><div class="character-menu-panel">
			<button data-act="importJson">导入角色 JSON</button>
			<button data-act="exportAll">备份全部角色</button>
			<button data-act="dupChar">复制当前角色</button>
			<label class="chk"><input type="checkbox" id="ignoreLimits"> 无视牌照限制（GM）</label>
			<button data-act="delChar" class="danger">删除当前角色</button>
		</div></details>
		<span id="saveStatus" class="save-status" role="status" aria-live="polite">保存在此浏览器</span>
	</div>
</header>
<nav class="tabs" aria-label="角色编辑页面">
	<button data-tab="pilot" class="on">① 驾驶员</button>
	<button data-tab="progress">② 等级成长</button>
	<button data-tab="mech">③ 机甲</button>
	<button data-tab="sheet" aria-label="④ 角色卡 / 导出">④ <span class="tab-full">角色卡 / 导出</span><span class="tab-short">导出</span></button>
	<button data-tab="battle">⑤ 战斗地图</button><button id="checkBadge" class="badge" title="查看规则检查"></button>
</nav>
<div id="notice"></div>
<main id="app" tabindex="-1"></main>
<div id="modal"></div>
<aside id="glossary" class="glossary" hidden aria-label="术语库">
	<div class="glossary-top"><h2>术语库</h2><button data-ui="closeGlossary" aria-label="关闭术语库">✕</button></div>
	<label class="search-field"><span>查找术语</span><input type="search" data-ui="glossarySearch" placeholder="术语名称或说明中的关键词"></label>
	<div class="glossary-cats"></div><p class="muted glossary-count" role="status"></p>
	<div class="glossary-list"></div>
</aside>
<aside id="weaponTable" class="weapon-table" hidden aria-label="武器表">
	<div class="glossary-top"><h2>武器表</h2><button data-ui="closeWeaponTable" aria-label="关闭武器表">✕</button></div>
	<div class="catalog-toolbar wt-toolbar"><label class="search-field"><span>查找武器</span><input type="search" data-wt="q" placeholder="名称、效果、标签或牌照"></label><div class="wt-filters"></div><button data-ui="resetWeaponTable">重置</button><span class="muted wt-count" role="status"></span></div>
	<div class="wt-scroll"><table class="wt-table"><thead><tr><th>武器</th><th>来源</th><th>尺寸</th><th>类型</th><th>射程</th><th>伤害</th><th>标签</th><th>SP</th><th>效果</th></tr></thead><tbody class="wt-body"></tbody></table></div>
</aside>
<footer class="foot">
	中文译名修订依据：用户提供的《枪骑兵》核心规则书 v3.5（<a href="TRANSLATION-V35.md" target="_blank">修订对照表</a>）。
	规则文本：<a href="https://reno-lam.github.io/Lancer-Free-Version/" target="_blank">Lancer 免费版繁中规则站</a>；数值数据：<a href="https://github.com/massif-press/lancer-data" target="_blank">massif-press/lancer-data</a>（COMP/CON 开源数据）。角色存在浏览器本地（localStorage），换电脑请用导出 JSON。
</footer>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="data.js"></script>
<script src="wizard.js"></script>
<script src="cardexport.js"></script>
<script src="rules.js"></script>
<script src="glossary.js"></script>
<script src="ui.js"></script>
<script src="faq-data.js"></script>
<script src="faq.js"></script>
<script src="frame-catalog.js"></script><link rel="stylesheet" href="frame-catalog.css">
<script src="battlemap.js"></script><script src="app.js"></script><link rel="stylesheet" href="battlemap.css">
</body>
</html>
